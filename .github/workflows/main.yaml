name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      # the environment of pixi.toml (pixi.lock), cached
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.84.2
          cache: true

      # the browser + the system libraries it needs (apt)
      - name: Install the browser
        run: pixi run playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: pixi run test ${{ matrix.browser }}
