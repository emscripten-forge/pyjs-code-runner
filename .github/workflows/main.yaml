name: CI

on:
  workflow_dispatch:
  push:
  pull_request:


defaults:
  run:
    shell: bash -l {0}


jobs:
  test_with_conda:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PYJS_CODE_RUNNER_TEST_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: dev-env.yml
          environment-name: dev-env
          init-shell: >-
            bash

      # installs the browser and the system libraries it needs (via apt)
      - name: Install Playwright browser
        shell: bash -el {0}
        run: |
          playwright install --with-deps ${{ matrix.browser }}

      - name: Install pyjs-code-runner
        shell: bash -el {0}
        run: |
          python -m pip install . --no-deps

      - name: Run Tests
        shell: bash -el {0}
        run: |
          pytest -s -vvvvv


  test_with_pip:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PYJS_CODE_RUNNER_TEST_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: dev-env-pip.yml
          environment-name: dev-env

      - name: Install pyjs-code-runner
        shell: bash -el {0}
        run: |
          python -m pip install .

      # installs the browser and the system libraries it needs (via apt)
      - name: Install Playwright browser
        shell: bash -el {0}
        run: |
          playwright install --with-deps ${{ matrix.browser }}

      - name: Run Tests
        shell: bash -el {0}
        run: |
          pytest -s -vvvvv
